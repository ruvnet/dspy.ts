<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="title desc">
<title id="title">DSPy.ts optimization walkthrough</title><desc id="desc">Six stages: define a signature, compose modules, evaluate candidates, select a winner, validate on fresh examples and optionally reuse experience in the same memory client.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071222"/><stop offset="1" stop-color="#151735"/></linearGradient><linearGradient id="accent"><stop stop-color="#45ead0"/><stop offset="1" stop-color="#a19aff"/></linearGradient></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}.flow{stroke-dasharray:8 10;animation:flow 3s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-72}}@keyframes pulse{50%{opacity:.45}}@media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}</style>
<rect width="960" height="450" rx="22" fill="url(#bg)"/><rect x="1" y="1" width="958" height="448" rx="21" fill="none" stroke="#344368"/>
<text x="36" y="43" fill="#f0f4ff" font-size="25" font-weight="700">From a task to a tested AI program</text><text x="36" y="73" fill="#9ab0cd" font-size="16">An explicit metric makes improvement measurable.</text>
<path class="flow" d="M282 161H352M608 161H678M807 205V270H160V320M282 362H352M608 362H678" fill="none" stroke="#64ddca" stroke-width="2"/>
<rect x="36" y="110" width="256" height="106" rx="12" fill="#122239" stroke="#3e526d"/><text x="53" y="135" fill="#6ce7d3" font-size="12" letter-spacing="1">01 / DEFINE</text><text x="53" y="165" fill="#eff5ff" font-size="21">Typed signature</text><text x="53" y="192" fill="#b0bfd4" font-size="14">Inputs and expected outputs</text><rect x="352" y="110" width="256" height="106" rx="12" fill="#122239" stroke="#3e526d"/><text x="369" y="135" fill="#6ce7d3" font-size="12" letter-spacing="1">02 / COMPOSE</text><text x="369" y="165" fill="#eff5ff" font-size="21">Reusable modules</text><text x="369" y="192" fill="#b0bfd4" font-size="14">Predict, reason, retrieve, act</text><rect x="668" y="110" width="256" height="106" rx="12" fill="#122239" stroke="#3e526d"/><text x="685" y="135" fill="#6ce7d3" font-size="12" letter-spacing="1">03 / EVALUATE</text><text x="685" y="165" fill="#eff5ff" font-size="21">Examples + metric</text><text x="685" y="192" fill="#b0bfd4" font-size="14">Compare candidate prompts</text><rect x="36" y="310" width="256" height="106" rx="12" fill="#122239" stroke="#3e526d"/><text x="53" y="335" fill="#6ce7d3" font-size="12" letter-spacing="1">04 / SELECT</text><text x="53" y="365" fill="#eff5ff" font-size="21">Best candidate</text><text x="53" y="392" fill="#b0bfd4" font-size="14">Keep the measured winner</text><rect x="352" y="310" width="256" height="106" rx="12" fill="#122239" stroke="#3e526d"/><text x="369" y="335" fill="#6ce7d3" font-size="12" letter-spacing="1">05 / VALIDATE</text><text x="369" y="365" fill="#eff5ff" font-size="21">Fresh examples</text><text x="369" y="392" fill="#b0bfd4" font-size="14">Check quality before shipping</text><rect x="668" y="310" width="256" height="106" rx="12" fill="#122239" stroke="#3e526d"/><text x="685" y="335" fill="#6ce7d3" font-size="12" letter-spacing="1">06 / REUSE</text><text x="685" y="365" fill="#eff5ff" font-size="21">Optional memory</text><text x="685" y="392" fill="#b0bfd4" font-size="14">Replay within the same client</text></svg>
